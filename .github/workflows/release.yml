# Draft a GitHub release when a version tag (e.g. 0.7.1) is pushed.
# Based on Sheiko Task Lifecycle's release.yml, with three additions:
#   1. the tag must equal manifest.json's version (Obsidian's convention),
#   2. the release build must contain no image data: sprites are never published,
#   3. build provenance (attestation) only runs once the repo is public.

name: Release

on:
    push:
        tags:
            - '*'

# One run per tag at a time: a second run for the same tag waits, then sees the first one's draft.
concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Tag must match manifest.json version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version="$(node -p "require('./manifest.json').version")"
                  if [ "$tag" != "$version" ]; then
                    echo "::error::Tag $tag does not match manifest.json version $version"
                    exit 1
                  fi

            - name: Build and test
              run: |
                  npm ci
                  npm run build
                  npm test

            - name: Release build must not contain sprites
              run: |
                  if grep -q 'data:image/' main.js; then
                    echo "::error::main.js contains image data. Sprites must never be published."
                    exit 1
                  fi
                  echo "OK: placeholder-badge build, no image data."

            - name: Attest build provenance (public repo only)
              if: ${{ !github.event.repository.private }}
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      styles.css

            - name: Create draft release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  # Drafts aren't returned by the by-tag endpoint, so list all releases.
                  existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .id")
                  if [ -n "$existing" ]; then
                    echo "A release for $tag already exists (id $existing); not creating another."
                    exit 0
                  fi
                  gh release create "$tag" \
                    --title="v$tag" \
                    --draft \
                    main.js manifest.json styles.css
